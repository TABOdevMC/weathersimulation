<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Sandbox</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font:14px system-ui}.app{min-height:100vh;padding:14px}.top,.panel{background:#0c192b;border:1px solid #203550;border-radius:12px}.top{padding:14px 18px;margin-bottom:12px;display:flex;justify-content:space-between}.title{font-size:21px;font-weight:800}.muted{color:#8fa6c2}.grid{display:grid;grid-template-columns:220px 1fr 230px;gap:12px}.panel{padding:12px}.panel h3{font-size:12px;text-transform:uppercase;color:#9db4d0}.stage{height:calc(100vh - 125px);min-height:420px;background:#030a13;border:1px solid #203550;border-radius:12px;overflow:hidden}.stage canvas{width:100%;height:100%;display:block;cursor:crosshair}button,select,input{width:100%;padding:9px;border-radius:8px;border:1px solid #29415e;background:#11243a;color:#eef6ff;margin:5px 0}button{cursor:pointer}.on{background:#2563eb}.metric{background:#102239;border-radius:8px;padding:9px;margin:7px 0}.metric small{display:block;color:#8fa6c2}.metric b{font-size:18px}@media(max-width:850px){.grid{grid-template-columns:1fr}.stage{height:55vh}}</style></head><body><div class="app"><header class="top"><div><div class="title">🌦 Weather Sandbox</div><div class="muted">Simulateur météo autonome — aucun build, aucun framework</div></div><div id="status">● Prêt</div></header><div class="grid"><aside class="panel"><h3>Simulation</h3><button id="run" class="on">▶ Démarrer</button><button id="reset">↻ Réinitialiser</button><label class="muted">Vitesse <b id="sv">1×</b></label><input id="speed" type="range" min=".25" max="4" step=".25" value="1"><h3>Scénario</h3><select id="scenario"><option value="normal">☀️ Normal</option><option value="storm">⛈ Orage</option><option value="heat">🔥 Canicule</option><option value="cold">❄️ Froid</option></select><h3>Couche</h3><select id="layer"><option value="t">Température</option><option value="h">Humidité</option><option value="w">Vent</option><option value="r">Pluie</option></select><p class="muted">Clique sur la carte pour chauffer et humidifier localement.</p></aside><main class="stage"><canvas id="c"></canvas></main><aside class="panel"><h3>Conditions</h3><div class="metric"><small>Température</small><b id="temp">18 °C</b></div><div class="metric"><small>Humidité</small><b id="hum">60 %</b></div><div class="metric"><small>Vent</small><b id="wind">12 km/h</b></div><div class="metric"><small>Pluie</small><b id="rain">0 mm/h</b></div><div class="metric"><small>Pression</small><b id="press">1013 hPa</b></div><h3>Point local</h3><div id="local" class="muted">Clique sur la carte</div></aside></div></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=80,H=50,I=(x,y)=>y*W+x,cl=(v,a,b)=>Math.max(a,Math.min(b,v));let T=new Float32Array(W*H),HUM=new Float32Array(W*H),WX=new Float32Array(W*H),WY=new Float32Array(W*H),run=false,spd=1,sc='normal',lay='t',px=-1,py=-1,time=0;
function reset(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let d=Math.hypot(x/W-.5,y/H-.5);T[I(x,y)]=18-16*d+3*Math.sin(x*.12)*Math.cos(y*.1);HUM[I(x,y)]=62+20*Math.sin(x*.08)*Math.sin(y*.1);WX[I(x,y)]=10+5*Math.sin(y*.15);WY[I(x,y)]=5+4*Math.cos(x*.1)}time=0;draw();metrics()}reset();
function step(){time+=.025*spd;for(let i=0;i<T.length;i++){let target=sc==='heat'?30:sc==='cold'?3:sc==='storm'?16:18;T[i]+=(target-T[i])*.001+Math.sin(time+i*.013)*.015;HUM[i]=cl(HUM[i]+(sc==='storm'?0.05:-0.01)+Math.sin(time+i*.009)*.02,0,100);WX[i]=cl(WX[i]+Math.sin(time+i*.01)*.04,0,40);WY[i]=cl(WY[i]+Math.cos(time+i*.008)*.04,0,40)}}
function col(v,a,b){let p=cl((v-a)/(b-a),0,1),r=Math.round(255*p),g=Math.round(180*(1-Math.abs(p-.5)*2)),q=Math.round(255*(1-p));return'rgb('+r+','+g+','+q+')'}
function draw(){let w=C.clientWidth,h=C.clientHeight,d=devicePixelRatio||1;C.width=w*d;C.height=h*d;X.setTransform(d,0,0,d,0,0);let cw=w/W,ch=h/H;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=I(x,y),v=lay==='t'?T[i]:lay==='h'?HUM[i]:lay==='w'?Math.hypot(WX[i],WY[i]):Math.max(0,(HUM[i]-70)*.2);X.fillStyle=lay==='r'?col(v,0,6):lay==='w'?col(v,0,40):lay==='h'?col(v,0,100):col(v,0,35);X.fillRect(x*cw,y*ch,cw+1,ch+1)}if(px>=0){X.strokeStyle='white';X.lineWidth=2;X.beginPath();X.arc((px+.5)*cw,(py+.5)*ch,12,0,7);X.stroke()}}
function metrics(){let avg=a=>a.reduce((s,v)=>s+v,0)/a.length;document.getElementById('temp').textContent=avg(T).toFixed(1)+' °C';document.getElementById('hum').textContent=avg(HUM).toFixed(0)+' %';document.getElementById('wind').textContent=Math.hypot(avg(WX),avg(WY)).toFixed(1)+' km/h';document.getElementById('rain').textContent=Math.max(0,(avg(HUM)-70)*.15).toFixed(1)+' mm/h';document.getElementById('press').textContent=(1013-(avg(T)-18)*1.5).toFixed(0)+' hPa';if(px>=0){let i=I(px,py);document.getElementById('local').textContent=T[i].toFixed(1)+' °C · '+HUM[i].toFixed(0)+' % · '+Math.hypot(WX[i],WY[i]).toFixed(1)+' km/h'}}
function loop(){if(run){step();draw();metrics()}requestAnimationFrame(loop)}loop();document.getElementById('run').onclick=()=>{run=!run;document.getElementById('run').textContent=run?'⏸ Pause':'▶ Démarrer';document.getElementById('status').textContent=run?'● Simulation active':'● En pause'};document.getElementById('reset').onclick=reset;document.getElementById('speed').oninput=e=>{spd=+e.target.value;document.getElementById('sv').textContent=spd+'×'};document.getElementById('scenario').onchange=e=>{sc=e.target.value;reset()};document.getElementById('layer').onchange=e=>{lay=e.target.value;draw()};function pick(e){let r=C.getBoundingClientRect();px=cl(Math.floor((e.clientX-r.left)/r.width*W),0,W-1);py=cl(Math.floor((e.clientY-r.top)/r.height*H),0,H-1);let i=I(px,py);T[i]+=4;HUM[i]=cl(HUM[i]+8,0,100);draw();metrics()}C.onpointerdown=pick;C.onpointermove=e=>{if(e.buttons)pick(e)};onresize=draw;onresize();
</script></body></html>
